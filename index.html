<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ILAW Lesson Planning Agent — DepEd Grade 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
/* ── Reset & Variables ───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:    #0D6E8A;
  --blue-dk: #084F65;
  --blue-lt: #E3F4F8;
  --gold:    #F5A623;
  --gold-lt: #FFF5E0;
  --red:     #E8344A;
  --green:   #1A7A4A;
  --purple:  #7B3FA0;
  --orange:  #C06820;
  --dark:    #0A2A35;
  --text:    #1A2E35;
  --mid:     #4A6670;
  --light:   #8AAAB5;
  --bg:      #F4F8FA;
  --white:   #FFFFFF;
  --card-border: #D5E8EE;
  --font-head: 'Sora', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --r: 14px;
  --rs: 8px;
  --shadow: 0 2px 12px rgba(13,110,138,0.10);
  --shadow-lg: 0 8px 32px rgba(13,110,138,0.14);
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Layout ──────────────────────────────────────────────── */
.app { max-width: 900px; margin: 0 auto; padding: 0 0 4rem; }

/* ── Header ──────────────────────────────────────────────── */
.header {
  background: var(--dark);
  padding: 2rem 2.5rem 1.8rem;
  position: relative;
  overflow: hidden;
}

.header-blob {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.header-blob-1 { width: 280px; height: 280px; top: -100px; right: -60px; background: radial-gradient(circle, rgba(13,110,138,.45), transparent 70%); }
.header-blob-2 { width: 180px; height: 180px; bottom: -80px; left: 25%; background: radial-gradient(circle, rgba(245,166,35,.2), transparent 70%); }

.header-inner { position: relative; z-index: 1; display: flex; align-items: center; gap: 18px; }

.header-logo {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head); font-size: 22px; font-weight: 800;
  color: var(--dark); flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(245,166,35,.4);
}

.header-text { flex: 1; }
.header-text h1 {
  font-family: var(--font-head); font-size: 20px; font-weight: 800;
  color: #fff; letter-spacing: -0.4px; line-height: 1.2;
}
.header-text p { font-size: 12.5px; color: rgba(255,255,255,.55); margin-top: 3px; }

.header-badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.hbadge {
  font-size: 11px; font-weight: 600; padding: 3px 10px;
  border-radius: 20px; letter-spacing: 0.2px;
}
.hbadge-gold  { background: var(--gold); color: var(--dark); }
.hbadge-teal  { background: rgba(13,110,138,.5); color: #fff; border: 1px solid rgba(13,110,138,.6); }
.hbadge-white { background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.15); }

/* ── ILAW Legend ──────────────────────────────────────────── */
.ilaw-legend {
  display: grid; grid-template-columns: repeat(4,1fr);
  margin: 1.5rem 1.5rem 0;
  background: var(--white);
  border-radius: var(--r);
  border: 1px solid var(--card-border);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.ilaw-pill {
  padding: 14px 10px; text-align: center;
  border-right: 1px solid var(--card-border);
  transition: background .15s;
}
.ilaw-pill:last-child { border-right: none; }
.ilaw-pill:hover { background: var(--bg); }

.ilaw-letter { font-family: var(--font-head); font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 3px; }
.ilaw-word   { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
.ilaw-desc   { font-size: 10.5px; color: var(--mid); line-height: 1.4; }

/* ── Term Selector ───────────────────────────────────────── */
.term-selector {
  display: grid; grid-template-columns: repeat(3,1fr);
  margin: 1rem 1.5rem 0;
  background: var(--white);
  border-radius: var(--r);
  border: 1px solid var(--card-border);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.term-card {
  padding: 14px 16px; cursor: pointer;
  border-right: 1px solid var(--card-border);
  transition: background .15s; user-select: none;
}
.term-card:last-child { border-right: none; }
.term-card:hover:not(.active) { background: var(--bg); }
.term-card.active { background: var(--blue); }

.term-num  { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--blue); margin-bottom: 2px; }
.term-card.active .term-num { color: rgba(255,255,255,.7); }
.term-name { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.term-card.active .term-name { color: #fff; }
.term-dates { font-size: 11px; color: var(--light); }
.term-card.active .term-dates { color: rgba(255,255,255,.65); }

/* ── Card ─────────────────────────────────────────────────── */
.card {
  background: var(--white);
  margin: 1rem 1.5rem 0;
  border-radius: var(--r);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card-header {
  padding: 12px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; gap: 10px;
}

.step-badge {
  width: 26px; height: 26px;
  background: var(--blue);
  color: #fff; border-radius: 8px;
  font-family: var(--font-head); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.card-header-title { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--blue); }

.card-body { padding: 20px; }

/* ── Subject Selector ────────────────────────────────────── */
.subject-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }

.subject-opt {
  padding: 14px 10px; border: 1.5px solid var(--card-border);
  border-radius: 10px; cursor: pointer;
  text-align: center; user-select: none;
  transition: all .18s; background: var(--white);
}
.subject-opt:hover { border-color: var(--blue); background: var(--blue-lt); }
.subject-opt.sel { border-color: var(--blue); background: var(--blue); }

.subject-icon { font-size: 24px; display: block; margin-bottom: 5px; }
.subject-label { font-family: var(--font-head); font-size: 12px; font-weight: 700; color: var(--mid); }
.subject-opt.sel .subject-label { color: #fff; }

/* ── Week Grid ───────────────────────────────────────────── */
.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(68px,1fr));
  gap: 6px; margin-top: 12px;
}

.week-chip {
  padding: 8px 4px; text-align: center;
  border: 1.5px solid var(--card-border);
  border-radius: 8px; cursor: pointer;
  font-family: var(--font-head); font-size: 11.5px; font-weight: 600;
  color: var(--mid); background: var(--white);
  transition: all .15s; user-select: none;
}
.week-chip:hover { border-color: var(--blue); color: var(--blue); }
.week-chip.sel { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ── Form Fields ──────────────────────────────────────────── */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }

.field-label {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--font-head); font-size: 11px; font-weight: 700;
  color: var(--mid); text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 7px;
}

.opt-tag {
  font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0;
  color: var(--light); background: var(--bg);
  padding: 1px 8px; border-radius: 10px; border: 1px solid var(--card-border);
}

.hint { font-size: 11.5px; color: var(--light); margin-top: -4px; margin-bottom: 7px; font-weight: 400; text-transform: none; letter-spacing: 0; }

input[type="text"], select, textarea {
  width: 100%; font-family: var(--font-body); font-size: 14px;
  padding: 10px 14px;
  border: 1.5px solid var(--card-border);
  border-radius: 9px;
  background: var(--white); color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}
input[type="text"]:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(13,110,138,.12);
}
textarea { resize: vertical; min-height: 80px; line-height: 1.55; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ── Generate Button ──────────────────────────────────────── */
.gen-wrap { padding: 1.2rem 1.5rem 0; }

.gen-btn {
  width: 100%; padding: 15px 24px;
  background: var(--blue);
  color: #fff; border: none; border-radius: 11px;
  font-family: var(--font-head); font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: -0.2px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  transition: background .2s, transform .1s, box-shadow .2s;
  box-shadow: 0 4px 16px rgba(13,110,138,.3);
}
.gen-btn:hover { background: var(--blue-dk); box-shadow: 0 6px 20px rgba(13,110,138,.4); }
.gen-btn:active { transform: scale(.99); }
.gen-btn:disabled { background: #7AACBC; cursor: not-allowed; transform: none; box-shadow: none; }

.spin {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .65s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error ────────────────────────────────────────────────── */
.err-box {
  margin: 1rem 1.5rem 0; padding: 13px 16px;
  background: #FEF2F2; border: 1px solid #FECACA;
  border-radius: 9px; font-size: 13px; color: #991B1B;
  display: none;
}

/* ── Result ───────────────────────────────────────────────── */
.result-wrap { margin: 1.2rem 1.5rem 0; }

.result-card {
  background: var(--white);
  border-radius: var(--r);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.result-header {
  padding: 14px 20px; background: var(--dark);
  display: flex; align-items: center; justify-content: space-between;
}
.result-header-title { font-family: var(--font-head); font-size: 13.5px; font-weight: 700; color: #fff; }
.result-header-meta  { font-size: 11px; color: rgba(255,255,255,.5); }

.result-tabs {
  display: flex; background: var(--bg);
  border-bottom: 1px solid var(--card-border);
}
.rtab {
  flex: 1; padding: 11px 8px;
  font-family: var(--font-head); font-size: 12px; font-weight: 700;
  cursor: pointer; border: none; background: none;
  color: var(--light); border-bottom: 2.5px solid transparent;
  transition: all .2s;
}
.rtab.active { color: var(--blue); border-bottom-color: var(--blue); background: var(--white); }

.result-body { padding: 22px; max-height: 580px; overflow-y: auto; }

/* ── ILAW Content ─────────────────────────────────────────── */
.meta-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 9px;
  margin-bottom: 20px;
}
.meta-item {
  background: var(--bg); border: 1px solid var(--card-border);
  border-radius: 8px; padding: 9px 12px;
}
.meta-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--light); margin-bottom: 2px; }
.meta-val { font-family: var(--font-head); font-size: 12.5px; font-weight: 600; color: var(--text); }

.ilaw-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
.ilaw-block:last-child { border-bottom: none; margin-bottom: 0; }

.ilaw-block-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ilaw-block-badge {
  width: 30px; height: 30px; border-radius: 8px;
  font-family: var(--font-head); font-size: 15px; font-weight: 800;
  color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.ilaw-block-title { font-family: var(--font-head); font-size: 13.5px; font-weight: 700; color: var(--text); }
.ilaw-block-sub { font-size: 11px; color: var(--light); }

.obj-row { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 9px; }
.obj-tag {
  font-size: 10px; font-weight: 700; padding: 2px 9px;
  border-radius: 5px; white-space: nowrap; margin-top: 2px; flex-shrink: 0;
}
